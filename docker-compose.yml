# Lightweight local/production-like stack for GarudaCBT-Fork.
#
#   docker compose up -d --build
#
# The app code is bind-mounted, so changes apply without rebuilding. Only the
# PHP image is built (php-fpm on Alpine); nginx and MariaDB use upstream images.

name: garudacbt

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    volumes:
      - .:/var/www/html
      - ./docker/php/database.php:/var/www/html/application/config/database.php:ro
    environment:
      APP_UID: ${HOST_UID:-1000}
      APP_GID: ${HOST_GID:-1000}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-garuda_cbt}
      DB_USER: ${DB_USER:-garuda}
      DB_PASSWORD: ${DB_PASSWORD:-garuda}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8099}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      CI_ENV: ${CI_ENV:-production}
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mariadb:11.4
    command:
      - "--sql-mode=NO_AUTO_VALUE_ON_ZERO"
      - "--max_allowed_packet=256M"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-garuda_cbt}
      MARIADB_USER: ${DB_USER:-garuda}
      MARIADB_PASSWORD: ${DB_PASSWORD:-garuda}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  db-data:
