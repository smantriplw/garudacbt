; Runtime defaults for the container. Values mirror what the application and
; its import/export features need; keep them in sync with nginx client_max_body_size.

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 80M
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000
date.timezone = Asia/Jakarta

opcache.enable = 1
opcache.memory_consumption = 64
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

expose_php = Off
